[project]
name = "scopepilot"
version = "0.0.1"
description = "An assistant that helps people find their way around microscope vendor software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Leann Chen" }]
dependencies = [
    # The lowest release this code has been run against.
    "anthropic>=1.12.1",
    "pillow>=10",
]

[project.optional-dependencies]
# Reading screenshots out of public PDF guides for the offline test set.
corpus = ["pypdf>=5"]
dev = ["pytest>=8", "pypdf>=5"]

[project.scripts]
scopepilot = "scopepilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
